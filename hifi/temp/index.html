<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<div class="container">
<div class="card">
<div class="left-box">
<h1>Enter Temperature</h1>
<div>
<label for="degree">Degree</label> <br />
<input id="degree" type="number" />
<select name="" id="current-degree">
<option value="celsius">Celsius</option>
<option value="farenheit">Fahrenheit</option>
<option value="kelvin">Kelvin</option>
</select>
</div> 

<div>
<label for="degree">Convert in</label> <br />
<select name="" id="convert-degree">
<option value="celsius">Celsius</option>
<option value="farenheit">Fahrenheit</option>
<option value="kelvin">Kelvin</option>
</select>
</div>
<button style="padding: 20px; margin-top: 30px;">Convert</button>
</div>
<div id="result" class="right-box"></div>

</body>
</html>
